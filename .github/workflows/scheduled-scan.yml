name: Scheduled Strategy Scan

on:
  schedule:
    # Every 15 minutes during US market hours (13:30-21:00 UTC = 9:30 AM - 5 PM ET)
    - cron: '*/15 13-21 * * 1-5'
    # Crypto and forex run 24/7 -- off-hours scan every 30 min
    - cron: '0,30 0-12,22-23 * * *'
    - cron: '0,30 0-12,22-23 * * 6-7'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'manual'

jobs:
  scan:
    name: Run strategy scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger scan-all
        env:
          WEALTH_OS_API_KEY: ${{ secrets.WEALTH_OS_API_KEY }}
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${WEALTH_OS_API_KEY}" \
            -H "Content-Type: application/json" \
            "${SITE_URL}/api/internal/scan-all")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Scan failed with HTTP $HTTP_CODE"
            exit 1
          fi

          # Extract and print summary
          STRATEGIES=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('strategies_scanned',0))" 2>/dev/null || echo "?")
          ELAPSED=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('elapsed_ms',0))" 2>/dev/null || echo "?")
          echo "Scanned $STRATEGIES strategies in ${ELAPSED}ms"
